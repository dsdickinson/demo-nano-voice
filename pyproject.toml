[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "demo-nano-voice"
version = "0.1.0"
description = "A modern decoder-only LLM trained from scratch with an edge voice assistant pipeline for NVIDIA Jetson Orin Nano."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Steve Dickinson" }
]
dependencies = [
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "numpy>=1.24.0",
    "tiktoken>=0.6.0",
    "faiss-cpu>=1.8.0",
    "sentence-transformers>=2.5.0",
    "sounddevice>=0.4.6",
    "scipy>=1.11.0",
    "faster-whisper>=1.0.0",
    "piper-tts>=1.2.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
